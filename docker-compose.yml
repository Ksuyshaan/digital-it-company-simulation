# Digital IT Company Simulation — развёртывание на сервере университета (п. 9 ТЗ)
#   docker compose up -d --build                       — БД, хранилище файлов (S3), API, фронтенд
#   docker compose --profile antivirus up -d           — плюс ClamAV
#   docker compose exec api npm run seed               — загрузить демо-курс
# Фронтенд: http://localhost:8080 · API: http://localhost:8080/api · документация: /api/docs

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dits
      POSTGRES_USER: dits
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dits}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dits -d dits"]
      interval: 5s
      retries: 10

  # S3-совместимое хранилище файлов. MinIO больше не публикует образы в открытых реестрах,
  # поэтому по умолчанию — SeaweedFS (тот же S3 API). Если у IT-службы есть свой MinIO/S3 —
  # уберите этот сервис и укажите S3_ENDPOINT/ключи для api.
  s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - files:/data
      - ./deploy/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["antivirus"]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://dits:${DB_PASSWORD:-dits}@db:5432/dits?schema=public
      PORT: 3000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-university.kz}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-true}
      OIDC_PROVIDER: ${OIDC_PROVIDER:-microsoft}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dits}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dits-secret-change-me}
      S3_BUCKET: dits-files
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Digital IT Company <noreply@university.kz>}
      BACKUP_DIR: /app/backups
      BACKUP_KEEP_DAYS: 30
    volumes:
      - backups:/app/backups
    ports:
      - "127.0.0.1:3000:3000"

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  files:
  backups:
